---
name: Connections by application and state
description: Summarizes current connections by database, user, application, client, and state.
requires_monitor: true
result: current
guidance:
  use_when:
    - Connection usage is unexpectedly high or a connection pool is exhausted.
    - Identifying which applications account for database sessions.
  inspect:
    - Applications or users holding many connections.
    - Large groups of idle or idle-in-transaction sessions.
  related:
    - activity.idle_transactions
    - activity.long_transactions
columns:
  application_name: Client-supplied application name.
  client_address: Network address of the client; null represents a local Unix socket.
  connections: Number of sessions in the group.
  database_name: Database to which the sessions are connected.
  state: Current backend state reported by PostgreSQL.
  user_name: Connected PostgreSQL role.
parameters:
  limit:
    type: integer
    minimum: 1
    nullable: true
    default: 20
    description: Maximum number of rows to show. Use NULL for no limit.
sql:
  - requires:
      postgresql: "14"
    statement: |
      SELECT datname AS database_name
           , usename AS user_name
           , application_name
           , client_addr AS client_address
           , state
           , pg_catalog.count(*) AS connections
        FROM pg_catalog.pg_stat_activity
       GROUP BY datname
              , usename
              , application_name
              , client_addr
              , state
       ORDER BY connections DESC
              , database_name
              , user_name
              , application_name
              , state
              , client_address
       LIMIT @limit;
